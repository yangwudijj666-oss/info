<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>企业微信</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#000;--card:#191919;--act:#252525;--line:#262626;--txt:#fff;--sub:#888;--mut:#555;--blue:#2f7cf6;--grn:#28c76f;--org:#e67e22;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
html,body{width:100%;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC",sans-serif;overflow:hidden}
#app{width:100%;height:100%;display:flex;flex-direction:column}
.navbar{flex-shrink:0;padding-top:var(--st);height:calc(44px + var(--st));background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-left:16px;padding-right:16px;position:relative;z-index:20;user-select:none}
.nav-title{position:absolute;left:50%;bottom:11px;transform:translateX(-50%);font-size:17px;font-weight:600;max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-left,.nav-right{height:44px;display:flex;align-items:center;gap:14px;z-index:2}
.nav-btn{color:var(--txt);cursor:pointer;display:flex;align-items:center}
.tab-views{flex:1;overflow:hidden;position:relative}
.tab-page{width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding-bottom:18px}
.tab-page.active{display:block}
.search-wrap{padding:6px 14px 8px;background:var(--bg)}
.search-bar{height:34px;background:var(--card);border-radius:8px;display:flex;align-items:center;padding:0 12px;gap:6px}
.search-bar input{width:100%;background:transparent;border:none;outline:none;color:var(--txt);font-size:14px;text-align:center}
.search-bar input:focus{text-align:left}
.search-bar input::placeholder{color:#666}
.group{background:var(--card);margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;position:relative;cursor:pointer;user-select:none}
.row:active{background:var(--act)}
.row:not(:last-child)::after{content:"";position:absolute;left:52px;right:0;bottom:0;height:.5px;background:var(--line)}
.plain-group .row:not(:last-child)::after{left:16px}
.row-left{display:flex;align-items:center;font-size:16px;color:var(--txt);gap:14px}
.row-right{display:flex;align-items:center;justify-content:flex-end;font-size:15px;color:var(--sub);margin-left:12px;text-align:right}
.arrow{margin-left:8px;color:var(--mut);font-size:14px;font-weight:600;flex-shrink:0}
.msg-subbar{display:flex;align-items:center;justify-content:space-between;padding:6px 22px 10px;border-bottom:.5px solid #181818;font-size:13px;color:#aaa}
.chat-item{display:flex;align-items:center;padding:12px 16px;background:var(--bg);position:relative;cursor:pointer}
.chat-item:active{background:var(--card)}
.chat-item::after{content:"";position:absolute;left:74px;right:0;bottom:0;height:.5px;background:#1a1a1a}
.chat-avatar{width:46px;height:46px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;position:relative;font-size:20px}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#fa5151;color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.chat-body{flex:1;margin-left:12px;overflow:hidden}
.chat-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.chat-name{font-size:16px;color:var(--txt);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:12px;color:var(--mut);flex-shrink:0;margin-left:8px}
.chat-msg{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-toolbar{display:flex;align-items:center;justify-content:space-around;padding:10px 8px 12px;border-bottom:.5px solid #1d1d1d;font-size:13px;color:#bbb}
.doc-item{display:flex;align-items:center;padding:13px 16px;position:relative;cursor:pointer}
.doc-item:active{background:var(--card)}
.doc-item::after{content:"";position:absolute;left:56px;right:16px;bottom:0;height:.5px;background:#1d1d1d}
.doc-icon{width:28px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;margin-right:14px;flex-shrink:0;color:#fff;font-size:15px}
.doc-body{flex:1;overflow:hidden}
.doc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.doc-title{font-size:16px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.doc-date{font-size:12px;color:var(--mut);flex-shrink:0}
.doc-sub{font-size:13px;color:#777}
.section-caption{padding:10px 16px 6px;font-size:13px;color:#777;background:#121212}
.contact-sq-icon{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.folder-icon{width:34px;height:34px;border-radius:7px;background:#23272e;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dept-members{display:none;background:#121212}
.dept-members.open{display:block}
.member-row{padding:11px 16px 11px 64px;display:flex;align-items:center;justify-content:space-between;border-top:.5px solid #222;cursor:pointer}
.contacts-footer{text-align:center;padding:18px 0;font-size:14px;color:#666}
.wb-banner{margin:4px 12px 10px;border-radius:10px;background:linear-gradient(135deg,#c8d6e5,#8fa8c8);padding:14px 16px 10px;cursor:pointer}
.wb-banner-school{font-size:14px;font-weight:700;color:#1b4f3e;margin-bottom:6px}
.wb-banner-main{font-size:23px;font-weight:800;color:#1a56b8;margin-bottom:4px}
.wb-banner-sub{font-size:13px;font-weight:600;color:#2c4c7e;margin-bottom:6px}
.wb-banner-tip{font-size:9px;color:#333;text-align:center;opacity:.75}
.wb-card{margin:0 12px 12px;background:var(--card);border-radius:12px;padding:14px 10px 18px}
.wb-card-title{padding:0 8px 14px;font-size:14px;color:#888}
.wb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px}
.wb-item{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.wb-app-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
.wb-app-name{font-size:12px;color:#e0e0e0;text-align:center;line-height:1.3;max-width:68px}
.me-card{margin:6px 12px 12px;background:var(--card);border-radius:12px;padding:18px 16px 14px;cursor:pointer}
.me-card-top{display:flex;justify-content:space-between;align-items:flex-start;min-height:82px}
.me-corp-row{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:600;color:#aaa;margin-bottom:14px}
.me-big-name{font-size:22px;font-weight:600;color:#fff}
.me-avatar-sq{width:56px;height:56px;border-radius:8px;background:radial-gradient(circle at 30% 30%,#2a2a2a,#121212);overflow:hidden;flex-shrink:0}
.me-avatar-sq img,.avatar-box img{width:100%;height:100%;object-fit:cover}
.me-card-bottom{margin-top:12px;padding-top:12px;border-top:.5px solid #282828;display:flex;align-items:center;justify-content:space-between;font-size:14px;color:#888}
.tabbar{flex-shrink:0;height:calc(52px + var(--sb));padding-bottom:var(--sb);background:#111;border-top:.5px solid #222;display:flex;align-items:center;justify-content:space-around;z-index:20;user-select:none}
.tab-btn{flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#888;cursor:pointer;position:relative}
.tab-btn.active{color:var(--blue)}
.tab-btn svg{width:22px;height:22px}
.tab-label{font-size:10px;font-weight:500}
.tab-badge{position:absolute;top:4px;left:55%;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#fa5151;color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.sub-page{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease}
.sub-page.open{transform:translateX(0)}
.sub-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(20px + var(--sb))}
.chat-messages{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.msg-row{display:flex;align-items:flex-start;gap:10px}
.msg-row.mine{flex-direction:row-reverse}
.msg-bubble{max-width:72%;padding:10px 13px;border-radius:10px;font-size:15px;line-height:1.45;background:var(--card);color:#fff;word-break:break-word}
.msg-row.mine .msg-bubble{background:var(--blue)}
.chat-input-bar{flex-shrink:0;padding:8px 12px calc(8px + var(--sb));background:#141414;border-top:.5px solid #262626;display:flex;align-items:center;gap:8px}
.chat-input-bar input{flex:1;height:36px;background:#222;border:none;border-radius:8px;padding:0 12px;color:#fff;font-size:15px;outline:none}
.send-btn{height:36px;padding:0 14px;border-radius:8px;background:var(--blue);color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer}
.avatar-box{width:58px;height:58px;border-radius:8px;background:radial-gradient(circle at 30% 30%,#262626,#141414);overflow:hidden}
.external-prefix{color:#888}.external-suffix{color:var(--org)}
.shield-icon{width:16px;height:16px;margin-right:4px;flex-shrink:0}
.double-line{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.bottom-main-text{font-size:16px;color:#fff}.sub-text{font-size:13px;color:#777}
#avatarInput{display:none}
.modal-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;align-items:center;justify-content:center;padding:20px}
.modal-box{width:100%;max-width:320px;background:#222;border-radius:14px;overflow:hidden;border:.5px solid #333}
.modal-title{padding:18px 16px 12px;text-align:center;font-size:16px;font-weight:600;color:#fff}
.modal-inputs{padding:0 16px 18px;display:flex;flex-direction:column;gap:10px}
.modal-input{width:100%;padding:10px 12px;background:#141414;border:.5px solid #3a3a3a;border-radius:8px;color:#fff;font-size:16px;outline:none;user-select:text;-webkit-user-select:text}
.modal-btns{display:flex;border-top:.5px solid #333}
.modal-btn{flex:1;padding:13px 0;text-align:center;font-size:16px;background:transparent;border:none;color:#888;cursor:pointer}
.modal-btn:last-child{border-left:.5px solid #333;color:#3b82f6;font-weight:600}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(38,38,38,.95);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:1200;display:none;border:.5px solid #3a3a3a}
</style>
</head>
<body ontouchstart="">
<div id="app">
<div class="navbar">
