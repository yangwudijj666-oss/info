<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="个人信息">
    <title>个人信息</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .navbar {
            position: sticky;
            top: 0;
            height: 44px;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 0 16px;
        }
        .navbar-back {
            position: absolute;
            left: 16px;
            font-size: 24px;
            color: #ffffff;
            font-weight: 300;
            line-height: 1;
        }
        .navbar-title {
            font-size: 17px;
            font-weight: 600;
        }
        .group {
            background-color: #191919;
            margin-bottom: 10px;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 16px;
            position: relative;
            cursor: pointer;
        }
        .row:active {
            background-color: #252525;
        }
        .row:not(:last-child)::after {
            content: "";
            position: absolute;
            left: 16px;
            right: 0;
            bottom: 0;
            height: 0.5px;
            background-color: #2c2c2c;
        }
        .row-left {
            display: flex;
            align-items: center;
            font-size: 16px;
            color: #ffffff;
            flex-shrink: 0;
        }
        .row-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            font-size: 15px;
            color: #888888;
            margin-left: 12px;
            text-align: right;
        }
        .arrow {
            margin-left: 8px;
            color: #555555;
            font-size: 14px;
            font-family: -apple-system, sans-serif;
            font-weight: 600;
            flex-shrink: 0;
        }
        .avatar-box {
            width: 58px;
            height: 58px;
            border-radius: 8px;
            background: radial-gradient(circle at 30% 30%, #262626, #141414);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .external-prefix {
            color: #888888;
        }
        .external-suffix {
            color: #e67e22;
        }
        .shield-icon {
            width: 16px;
            height: 16px;
            margin-right: 4px;
            flex-shrink: 0;
        }
        .double-line {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
        }
        .bottom-main-text {
            font-size: 16px;
            color: #ffffff;
        }
        .sub-text {
            font-size: 13px;
            color: #777777;
        }
        #avatarInput {
            display: none;
        }

        /* 自定义暗黑弹窗样式（兼容全屏桌面模式） */
        .modal-mask {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-box {
            width: 100%;
            max-width: 320px;
            background: #222222;
            border-radius: 14px;
            overflow: hidden;
            border: 0.5px solid #333333;
        }
        .modal-title {
            padding: 18px 16px 12px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }
        .modal-inputs {
            padding: 0 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .modal-input {
            width: 100%;
            padding: 10px 12px;
            background: #141414;
            border: 0.5px solid #3a3a3a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }
        .modal-btns {
            display: flex;
            border-top: 0.5px solid #333333;
        }
        .modal-btn {
            flex: 1;
            padding: 13px 0;
            text-align: center;
            font-size: 16px;
            background: transparent;
            border: none;
            color: #888888;
            cursor: pointer;
        }
        .modal-btn:last-child {
            border-left: 0.5px solid #333333;
            color: #3b82f6;
            font-weight: 600;
        }
        .modal-btn:active {
            background: #2c2c2c;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="navbar-back">‹</div>
        <div class="navbar-title">个人信息</div>
    </div>

    <!-- 第一组：头像、姓名、别名、性别 -->
    <div class="group" style="margin-top: 6px;">
        <div class="row" style="padding: 12px 16px;" onclick="document.getElementById('avatarInput').click()">
            <div class="row-left">头像</div>
            <div class="row-right">
                <div class="avatar-box" id="avatarBox"></div>
                <span class="arrow">&gt;</span>
            </div>
            <input type="file" id="avatarInput" accept="image/*" onchange="changeAvatar(event)">
        </div>
        <div class="row" onclick="openSingleModal('userName', '修改姓名', false)">
            <div class="row-left">姓名</div>
            <div class="row-right">
                <span id="val-userName">点击编辑</span>
                <span class="arrow">&gt;</span>
            </div>
        </div>
        <div class="row" onclick="openSingleModal('userAlias', '修改别名', true)">
            <div class="row-left">别名</div>
            <div class="row-right">
                <span id="val-userAlias">无</span>
                <span class="arrow">&gt;</span>
            </div>
        </div>
        <div class="row" onclick="toggleGender()">
            <div class="row-left">性别</div>
            <div class="row-right">
                <span id="val-userGender">男</span>
                <span class="arrow">&gt;</span>
            </div>
        </div>
    </div>

    <!-- 第二组：对外信息显示 -->
    <div class="group">
        <div class="row" onclick="openExternalModal()">
            <div class="row-left">对外信息显示</div>
            <div class="row-right">
                <span class="external-prefix" id="val-externalPrefix">点击编辑</span><span class="external-suffix" id="val-externalSuffix">@重庆邮电大学</span>
                <span class="arrow">&gt;</span>
            </div>
        </div>
    </div>

    <!-- 第三组：工作签名、所属企业、发票抬头 -->
    <div class="group">
        <div class="row" onclick="openSingleModal('workSignature', '工作签名', false)">
            <div class="row-left">工作签名</div>
            <div class="row-right">
                <span id="val-workSignature"></span>
                <span class="arrow">&gt;</span>
            </div>
        </div>
        <div class="row" onclick="openSingleModal('company', '所属企业', false)">
            <div class="row-left">所属企业</div>
            <div class="row-right">
                <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="#28c76f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <polyline points="9 12 11 14 15 10"></polyline>
                </svg>
                <span id="val-company">重庆邮电大学</span>
                <span class="arrow">&gt;</span>
            </div>
        </div>
        <div class="row" onclick="openSingleModal('invoiceTitle', '发票抬头', true)">
            <div class="row-left">发票抬头</div>
            <div class="row-right">
                <span id="val-invoiceTitle">无</span>
                <span class="arrow">&gt;</span>
            </div>
        </div>
    </div>

    <!-- 第四组：邮箱、地址 -->
    <div class="group">
        <div class="row" onclick="openSingleModal('email', '邮箱', true)">
            <div class="row-left">邮箱</div>
            <div class="row-right">
                <span id="val-email">无</span>
                <span class="arrow">&gt;</span>
            </div>
        </div>
        <div class="row" onclick="openSingleModal('address', '地址', true)">
            <div class="row-left">地址</div>
            <div class="row-right">
                <span id="val-address">无</span>
                <span class="arrow">&gt;</span>
            </div>
        </div>
    </div>

    <!-- 第五组：底部双行信息（独立分组，保留上方纯黑间隙） -->
    <div class="group">
        <div class="row" onclick="openBottomModal()">
            <div class="row-left double-line">
                <span class="bottom-main-text" id="val-bottomId">点击编辑</span>
                <span class="sub-text">
                    <span id="val-degree">本科生</span>/<span id="val-college">电子科学与工程学院</span>/<span id="val-grade">2024</span>
                </span>
            </div>
            <div class="row-right">
                <span class="arrow">&gt;</span>
            </div>
        </div>
    </div>

    <!-- 自定义编辑弹窗 -->
    <div class="modal-mask" id="editModal" onclick="if(event.target===this) closeModal()">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">编辑</div>
            <div class="modal-inputs" id="modalInputs"></div>
            <div class="modal-btns">
                <button class="modal-btn" onclick="closeModal()">取消</button>
                <button class="modal-btn" id="modalConfirmBtn">确定</button>
            </div>
        </div>
    </div>

    <script>
        const keys = [
            'userName', 'userAlias', 'userGender',
            'externalPrefix', 'externalSuffix',
            'workSignature', 'company', 'invoiceTitle',
            'email', 'address', 'bottomId',
            'degree', 'college', 'grade'
        ];

        window.onload = function() {
            keys.forEach(key => {
                const saved = localStorage.getItem(key);
                if (saved !== null) {
                    const el = document.getElementById('val-' + key);
                    if (el) el.innerText = saved;
                }
            });
            const savedAvatar = localStorage.getItem('userAvatar');
            if (savedAvatar) {
                document.getElementById('avatarBox').innerHTML = `<img src="${savedAvatar}">`;
            }
        };

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function openSingleModal(key, title, allowEmptyAsNone) {
            const el = document.getElementById('val-' + key);
            const current = el.innerText;
            const inputVal = (allowEmptyAsNone && current === '无') ? '' : (current === '点击编辑' ? '' : current);

            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalInputs').innerHTML = `
                <input class="modal-input" id="inp-single" type="text" value="${inputVal}" placeholder="请输入内容">
            `;
            document.getElementById('editModal').style.display = 'flex';
            setTimeout(() => document.getElementById('inp-single').focus(), 50);

            document.getElementById('modalConfirmBtn').onclick = function() {
                const trimmed = document.getElementById('inp-single').value.trim();
                const finalVal = (trimmed === '' && allowEmptyAsNone) ? '无' : trimmed;
                if (finalVal !== '' || !allowEmptyAsNone) {
                    el.innerText = finalVal;
                    localStorage.setItem(key, finalVal);
                }
                closeModal();
            };
        }

        function openExternalModal() {
            const prefixEl = document.getElementById('val-externalPrefix');
            const suffixEl = document.getElementById('val-externalSuffix');
            const curPrefix = prefixEl.innerText === '点击编辑' ? '' : prefixEl.innerText;

            document.getElementById('modalTitle').innerText = '修改对外信息显示';
            document.getElementById('modalInputs').innerHTML = `
                <input class="modal-input" id="inp-prefix" type="text" value="${curPrefix}" placeholder="对外显示名称">
                <input class="modal-input" id="inp-suffix" type="text" value="${suffixEl.innerText}" placeholder="机构后缀（如 @重庆邮电大学）">
            `;
            document.getElementById('editModal').style.display = 'flex';
            setTimeout(() => document.getElementById('inp-prefix').focus(), 50);

            document.getElementById('modalConfirmBtn').onclick = function() {
                const p = document.getElementById('inp-prefix').value.trim();
                const s = document.getElementById('inp-suffix').value.trim();
                if (p !== '') {
                    prefixEl.innerText = p;
                    localStorage.setItem('externalPrefix', p);
                }
                if (s !== '') {
                    suffixEl.innerText = s;
                    localStorage.setItem('externalSuffix', s);
                }
                closeModal();
            };
        }

        function openBottomModal() {
            const idEl = document.getElementById('val-bottomId');
            const degreeEl = document.getElementById('val-degree');
            const collegeEl = document.getElementById('val-college');
            const gradeEl = document.getElementById('val-grade');
            const curId = idEl.innerText === '点击编辑' ? '' : idEl.innerText;

            document.getElementById('modalTitle').innerText = '修改学籍/工号信息';
            document.getElementById('modalInputs').innerHTML = `
                <input class="modal-input" id="inp-id" type="text" value="${curId}" placeholder="学号 / 工号">
                <input class="modal-input" id="inp-degree" type="text" value="${degreeEl.innerText}" placeholder="学历（如：本科生）">
                <input class="modal-input" id="inp-college" type="text" value="${collegeEl.innerText}" placeholder="学院名称">
                <input class="modal-input" id="inp-grade" type="text" value="${gradeEl.innerText}" placeholder="年级（如：2024）">
            `;
            document.getElementById('editModal').style.display = 'flex';
            setTimeout(() => document.getElementById('inp-id').focus(), 50);

            document.getElementById('modalConfirmBtn').onclick = function() {
                const vId = document.getElementById('inp-id').value.trim();
                const vDeg = document.getElementById('inp-degree').value.trim();
                const vCol = document.getElementById('inp-college').value.trim();
                const vGra = document.getElementById('inp-grade').value.trim();

                if (vId !== '') { idEl.innerText = vId; localStorage.setItem('bottomId', vId); }
                if (vDeg !== '') { degreeEl.innerText = vDeg; localStorage.setItem('degree', vDeg); }
                if (vCol !== '') { collegeEl.innerText = vCol; localStorage.setItem('college', vCol); }
                if (vGra !== '') { gradeEl.innerText = vGra; localStorage.setItem('grade', vGra); }
                closeModal();
            };
        }

        function toggleGender() {
            const el = document.getElementById('val-userGender');
            const next = el.innerText === '男' ? '女' : '男';
            el.innerText = next;
            localStorage.setItem('userGender', next);
        }

        function changeAvatar(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64 = e.target.result;
                document.getElementById('avatarBox').innerHTML = `<img src="${base64}">`;
                localStorage.setItem('userAvatar', base64);
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
