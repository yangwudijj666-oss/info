<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="企业微信">
    <title>企业微信</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg-black: #000000;
            --bg-card: #191919;
            --bg-card-active: #252525;
            --border-line: #262626;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --text-muted: #555555;
            --brand-blue: #2f7cf6;
            --brand-green: #28c76f;
            --brand-orange: #e67e22;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-black);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
            overflow: hidden;
        }

        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 顶部导航栏 */
        .navbar {
            flex-shrink: 0;
            padding-top: var(--safe-top);
            height: calc(44px + var(--safe-top));
            background-color: var(--bg-black);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 16px;
            padding-right: 16px;
            position: relative;
            z-index: 20;
            user-select: none;
            -webkit-user-select: none;
        }
        .nav-title {
            position: absolute;
            left: 50%;
            bottom: 11px;
            transform: translateX(-50%);
            font-size: 17px;
            font-weight: 600;
            max-width: 62%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .nav-left, .nav-right {
            height: 44px;
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 2;
        }
        .nav-btn {
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 主内容滚动区 */
        .tab-views {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        .tab-page {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: none;
            padding-bottom: 18px;
        }
        .tab-page.active {
            display: block;
        }

        /* 通用搜索框 */
        .search-wrap {
            padding: 6px 14px 8px;
            background: var(--bg-black);
        }
        .search-bar {
            height: 34px;
            background: var(--bg-card);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
            gap: 6px;
            position: relative;
        }
        .search-bar input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 14px;
            text-align: center;
        }
        .search-bar input:focus {
            text-align: left;
        }
        .search-bar input::placeholder {
            color: #666666;
        }

        /* 通用分组卡片与行 */
        .group {
            background-color: var(--bg-card);
            margin-bottom: 10px;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            position: relative;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
        .row:active {
            background-color: var(--bg-card-active);
        }
        .row:not(:last-child)::after {
            content: "";
            position: absolute;
            left: 52px;
            right: 0;
            bottom: 0;
            height: 0.5px;
            background-color: var(--border-line);
        }
        .plain-group .row:not(:last-child)::after {
            left: 16px;
        }
        .row-left {
            display: flex;
            align-items: center;
            font-size: 16px;
            color: var(--text-primary);
            gap: 14px;
        }
        .row-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            font-size: 15px;
            color: var(--text-secondary);
            margin-left: 12px;
            text-align: right;
        }
        .arrow {
            margin-left: 8px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }

        /* ================= 1. 消息页（1:1 还原截图5） ================= */
        .msg-subbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 22px 10px;
            border-bottom: 0.5px solid #181818;
            font-size: 13px;
            color: #aaaaaa;
        }
        .msg-subbar-item {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-black);
            position: relative;
            cursor: pointer;
        }
        .chat-item:active {
            background: var(--bg-card);
        }
        .chat-item::after {
            content: "";
            position: absolute;
            left: 74px;
            right: 0;
            bottom: 0;
            height: 0.5px;
            background: #1a1a1a;
        }
        .chat-avatar {
            width: 46px;
            height: 46px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            flex-shrink: 0;
            position: relative;
        }
        .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 9px;
            background: #fa5151;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-body {
            flex: 1;
            margin-left: 12px;
            overflow: hidden;
        }
        .chat-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .chat-name {
            font-size: 16px;
            color: var(--text-primary);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
